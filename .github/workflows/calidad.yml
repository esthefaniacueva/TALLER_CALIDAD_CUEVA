name: Calidad del software
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Actualizar pip e instalar herramientas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-cov
      - name: Ejecutar pruebas y cobertura
        run: |
          python -m pytest -v --cov=banco --cov-report=term-missing --cov-fail-under=81
